name: atalaya-laptop
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atalaya
      POSTGRES_USER: atalaya
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U atalaya -d atalaya]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      ATALAYA_PUSH_ENABLED: ${ATALAYA_PUSH_ENABLED:-false}
      ATALAYA_CONTACT_RETENTION_DAYS: ${ATALAYA_CONTACT_RETENTION_DAYS:-0}
      DB_URL: jdbc:postgresql://postgres:5432/atalaya
      DB_PASSWORD: ${DB_PASSWORD:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      SYNC_USUARIO: ${SYNC_USUARIO:?required}
      SYNC_CLAVE: ${SYNC_CLAVE:?required}
      CONDOMINIO_ID: ${CONDOMINIO_ID:-1}
    depends_on:
      postgres: {condition: service_healthy}
    ports: [127.0.0.1:28080:8080]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    build: ./web
    ports: [127.0.0.1:28081:8080]
    depends_on: [backend]
    restart: unless-stopped
  edge:
    build: ./edge
    environment:
      LOCAL_UI_EMAIL: ${LOCAL_UI_EMAIL:?required}
      LOCAL_UI_PASSWORD: ${LOCAL_UI_PASSWORD:?required}
      PLACA_TOKEN: ${PLACA_TOKEN:?required}
      NEGRA_URL: ${NEGRA_URL:-http://backend:8080}
      SYNC_USUARIO: ${SYNC_USUARIO:?required}
      SYNC_CLAVE: ${SYNC_CLAVE:?required}
      CONDOMINIO_ID: ${CONDOMINIO_ID:-1}
      PANTALLA_ORIGEN: ${PANTALLA_ORIGEN:-127.0.0.1,::1}
    ports: ["${EDGE_BIND:-127.0.0.1}:8300:8300", "127.0.0.1:28082:8080"]
    volumes: [edge-data:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres-data:
  edge-data:

name: katana-local
services:
  katana-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: katana
      POSTGRES_USER: katana
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/init-env.py}
    volumes: [katana-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U katana -d katana]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  katana-backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://katana-db:5432/katana
      DB_PASSWORD: ${DB_PASSWORD:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      PLACA_TOKEN: ${PLACA_TOKEN:?required}
      PANTALLA_ORIGEN: ${PANTALLA_ORIGEN:-127.0.0.1,::1}
      RECOVER_IMPORTED_ADMIN: ${RECOVER_IMPORTED_ADMIN:-false}
    depends_on:
      katana-db: {condition: service_healthy}
    ports:
      - ${API_BIND:-127.0.0.1}:${KATANA_API_PORT:-28080}:8080
      - ${TCP_BIND:-127.0.0.1}:${KATANA_TCP_PORT:-8300}:8300
    healthcheck:
      test: [CMD, java, -cp, /app, Healthcheck]
      start_period: 40s
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging
  katana-web:
    build: ./web
    ports: ["${WEB_BIND:-127.0.0.1}:${KATANA_WEB_PORT:-28082}:8080"]
    depends_on:
      katana-backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
volumes:
  katana-data:

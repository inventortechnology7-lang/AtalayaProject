spring:
  application:
    name: katana-local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/katana}
    username: ${DB_USER:katana}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/katana
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
server:
  port: ${API_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
  tomcat:
    max-http-form-post-size: 64KB
springdoc:
  api-docs:
    path: /api/local/openapi
  swagger-ui:
    path: /api/local/docs
katana:
  tcp-port: ${TCP_PORT:8300}
  tcp-bind: ${TCP_BIND:0.0.0.0}
  token: ${PLACA_TOKEN}
  screen-origins: ${PANTALLA_ORIGEN:127.0.0.1,::1}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  recover-imported-admin: ${RECOVER_IMPORTED_ADMIN:false}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atalaya}
    username: ${DB_USER:atalaya}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
server:
  port: 8080
  error:
    include-message: never
  tomcat:
    max-http-form-post-size: 1MB
atalaya:
  admin-email: ${ADMIN_EMAIL}
  admin-password: ${ADMIN_PASSWORD}
  edge-email: ${SYNC_USUARIO}
  edge-password: ${SYNC_CLAVE}
  condo: ${CONDOMINIO_ID:1}

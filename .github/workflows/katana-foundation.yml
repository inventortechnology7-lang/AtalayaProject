name: Katana local foundation
on:
  push:
    branches: [refactor/katana-modern-local]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tcp-and-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B -f backend/pom.xml -Dtest=BoardTcpServerTest test
      - run: python3 scripts/test-katana-migration.py
